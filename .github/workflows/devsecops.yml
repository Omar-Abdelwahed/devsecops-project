name: DevSecOps Pipeline

# Orchestrator: chains the six levels of the pipeline. Each level lives in its own
# reusable workflow file (level1-...yml to level6-...yml) and only starts when the
# previous one succeeded.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time: a newer push waits for the running pipeline to finish.
concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: "1 Build & Test"
    uses: ./.github/workflows/level1-build-test.yml

  security-scans:
    name: "2 Security Scans"
    needs: build-test
    uses: ./.github/workflows/level2-security-scans.yml
    secrets: inherit

  reports:
    name: "3 Report Generation"
    needs: [build-test, security-scans]
    # Runs even if a scanner crashed: the gate then sees a missing report and blocks (fail closed).
    if: ${{ !cancelled() && needs.build-test.result == 'success' }}
    uses: ./.github/workflows/level3-reports.yml

  security-gate:
    name: "4 Security Gate"
    needs: reports
    if: ${{ !cancelled() && needs.reports.result == 'success' }}
    uses: ./.github/workflows/level4-security-gate.yml

  staging-dast:
    name: "5 Staging + DAST"
    needs: security-gate
    # Deployments only happen from main, never from a pull request.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/level5-staging-dast.yml

  deploy-production:
    name: "6 Deploy to Production"
    needs: staging-dast
    uses: ./.github/workflows/level6-deploy-production.yml

  notify:
    name: "Alerts"
    needs: [build-test, security-gate, staging-dast, deploy-production]
    if: ${{ always() }}
    uses: ./.github/workflows/notify-discord.yml
    with:
      build: ${{ needs.build-test.result }}
      gate: ${{ needs.security-gate.result }}
      staging: ${{ needs.staging-dast.result }}
      deploy: ${{ needs.deploy-production.result }}
    secrets: inherit
