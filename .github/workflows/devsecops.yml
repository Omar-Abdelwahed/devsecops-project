name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks (Quality Gate)
        run: |
          docker run -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" --verbose --report-path="/path/gitleaks-report.json"
      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sast-sca-scan:
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run Bandit (Quality Gate)
        run: |
          pip install bandit
          bandit -r app.py -f json -o bandit-report.json -ll
      - name: Run Semgrep (Quality Gate)
        run: |
          docker run -v ${{ github.workspace }}:/src returntocorp/semgrep:latest semgrep scan --config auto --json --output=/src/semgrep-report.json --error
      - name: Upload SAST Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-sca-reports
          path: |
            bandit-report.json
            semgrep-report.json

  build-and-dast:
    runs-on: ubuntu-latest
    needs: sast-sca-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t vulnerable-app:latest .
      - name: Run Trivy Image Scan (Quality Gate)
        run: |
          docker run -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}:/workspace aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL --format json -o /workspace/trivy-image-report.json vulnerable-app:latest
      - name: Upload DAST and Image Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-and-image-reports
          path: |
            trivy-image-report.json

            