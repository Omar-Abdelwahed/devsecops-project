name: DevSecOps Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" --verbose --report-path="/path/gitleaks-report.json" || true
      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sast-sca-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r app.py -f json -o bandit-report.json -ll || true
      - name: Run Semgrep
        run: |
          docker run -v ${{ github.workspace }}:/src returntocorp/semgrep:latest semgrep scan --config auto --json --output=/src/semgrep-report.json || true
      - name: Run Trivy FS (SCA)
        run: |
          docker run -v ${{ github.workspace }}:/workspace aquasec/trivy:latest fs --security-checks vuln --severity HIGH,CRITICAL --format json -o /workspace/trivy-fs-report.json /workspace || true
      - name: Upload SAST and SCA Reports
        uses: actions/upload-artifact@v4
        with:
          name: sast-sca-reports
          path: |
            bandit-report.json
            semgrep-report.json
            trivy-fs-report.json

  build-and-dast:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t vulnerable-app:latest .
      - name: Run Trivy Image Scan
        run: |
          docker run -v /var/run/docker.sock:/var/run/docker.sock -v ${{ github.workspace }}:/workspace aquasec/trivy:latest image --severity HIGH,CRITICAL --format json -o /workspace/trivy-image-report.json vulnerable-app:latest || true
      - name: Run Application Container
        run: docker run -d --name target-app -p 5000:5000 vulnerable-app:latest
      - name: Wait for App to Boot
        run: sleep 5
      - name: Run OWASP ZAP Baseline
        run: |
          docker run --rm --network="host" -v ${{ github.workspace }}:/zap/wrk/:rw zaproxy/zap-stable zap-baseline.py -t http://localhost:5000 -J zap-report.json -r zap-report.html || true
      - name: Upload DAST and Image Reports
        uses: actions/upload-artifact@v4
        with:
          name: dast-and-image-reports
          path: |
            trivy-image-report.json
            zap-report.json
            zap-report.html
