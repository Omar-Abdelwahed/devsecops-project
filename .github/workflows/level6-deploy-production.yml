name: "Level 6 - Manual Approval & Deploy"

# Reusable stage, called by devsecops.yml. The "production" GitHub environment has a
# required reviewer: the job waits until a person reviews the results and clicks Approve.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to production (after approval)
    runs-on: [self-hosted, windows, docker-desktop]
    environment:
      name: production
      url: http://127.0.0.1:8080
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check the production secret
        env:
          SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
        run: |
          if (-not $env:SECRET_KEY) {
            Write-Host "::error::Secret PROD_SECRET_KEY is missing. Add it under Settings > Environments > production > Environment secrets."
            exit 1
          }

      - uses: actions/checkout@v4

      # The exact image that passed the gate and staging: never rebuilt for production.
      # Level 5 already loaded it on this machine; download it only if it is missing.
      - name: Check if the image is already loaded
        id: image
        run: |
          $ErrorActionPreference = "Continue"   # "No such image" on stderr must not stop the step
          docker image inspect "devsecops-app:$env:GITHUB_SHA" *> $null
          "present=$($LASTEXITCODE -eq 0)".ToLower() | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          exit 0
      - uses: actions/download-artifact@v4
        if: steps.image.outputs.present != 'true'
        with:
          name: app-image
      - name: Load image
        if: steps.image.outputs.present != 'true'
        run: docker load -i app-image.tar.gz

      - name: Deploy to production (hardened container, automatic rollback)
        env:
          # Stable key so user sessions survive a redeploy. Stored as an environment secret.
          SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
        run: |
          .\scripts\deploy.ps1 -Environment production -Image "devsecops-app:$env:GITHUB_SHA" -Port 8080
          exit $LASTEXITCODE
