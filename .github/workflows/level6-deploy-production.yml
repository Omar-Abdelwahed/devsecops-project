name: "Level 6 - Deploy to Production"

# Reusable stage, called by devsecops.yml. Automatic: runs as soon as the Security Gate
# (level 4) and staging + DAST (level 5) have passed on main. No manual step, no GitHub secret.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to production
    runs-on: [self-hosted, windows, docker-desktop]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # The exact image that passed the gate and staging: never rebuilt for production.
      # Level 5 already loaded it on this machine; download it only if it is missing.
      - name: Check if the image is already loaded
        id: image
        run: |
          $ErrorActionPreference = "Continue"   # "No such image" on stderr must not stop the step
          docker image inspect "devsecops-app:$env:GITHUB_SHA" *> $null
          "present=$($LASTEXITCODE -eq 0)".ToLower() | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          exit 0
      - uses: actions/download-artifact@v4
        if: steps.image.outputs.present != 'true'
        with:
          name: app-image
      - name: Load image
        if: steps.image.outputs.present != 'true'
        run: docker load -i app-image.tar.gz

      - name: Deploy to production (hardened container, automatic rollback)
        run: |
          # Production secret key: generated once on this machine, then reused by every deploy so
          # user sessions survive a redeploy. Readable by this Windows account only; never in git or GitHub.
          $keyFile = Join-Path $env:USERPROFILE ".devsecops\prod-secret-key"
          if (-not (Test-Path $keyFile)) {
            New-Item -ItemType Directory -Force (Split-Path $keyFile) | Out-Null
            $bytes = New-Object byte[] 32
            [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            [IO.File]::WriteAllText($keyFile, (-join ($bytes | ForEach-Object { $_.ToString("x2") })))
            icacls $keyFile /inheritance:r /grant:r "${env:USERNAME}:F" | Out-Null
            Write-Host "Generated a new production secret key."
          }
          $env:SECRET_KEY = [IO.File]::ReadAllText($keyFile).Trim()
          .\scripts\deploy.ps1 -Environment production -Image "devsecops-app:$env:GITHUB_SHA" -Port 8080
          exit $LASTEXITCODE
