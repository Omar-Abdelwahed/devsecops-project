# SonarQube analysis settings (read by sonar-scanner in the "sonarqube" pipeline job).
sonar.projectKey=devsecops-project
sonar.projectName=DevSecOps Flask App
sonar.sourceEncoding=UTF-8

sonar.sources=app,Dockerfile
sonar.tests=tests
sonar.python.version=3.12

# Produced by the unit-tests job and passed in as an artifact.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Quality gate: the scanner waits for the server verdict and exits non-zero if it fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
