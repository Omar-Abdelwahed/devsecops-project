stages:
  - secrets
  - sast_sca
  - build
  - container_scan
  - dast

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  # Dynamically tag the image with the commit SHA
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# ==========================================
# 1. SECRET SCANNING (Gitleaks)
# ==========================================
gitleaks:
  stage: secrets
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source=. --verbose --report-path=gitleaks-report.json || true
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
  allow_failure: true

# ==========================================
# 2. SAST & SCA
# ==========================================
semgrep:
  stage: sast_sca
  image: semgrep/semgrep:latest
  script:
    - semgrep scan --config auto --json --output=semgrep-report.json || true
  artifacts:
    when: always
    paths:
      - semgrep-report.json
  allow_failure: true

bandit:
  stage: sast_sca
  image: python:3.8-slim
  before_script:
    - pip install bandit
  script:
    - bandit -r app.py -f json -o bandit-report.json -ll || true
  artifacts:
    when: always
    paths:
      - bandit-report.json
  allow_failure: true

trivy_sca:
  stage: sast_sca
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    # Scans requirements.txt for vulnerable libraries
    - trivy fs --security-checks vuln --severity HIGH,CRITICAL --format json -o trivy-fs-report.json . || true
  artifacts:
    when: always
    paths:
      - trivy-fs-report.json
  allow_failure: true

# ==========================================
# 3. BUILD & PUSH IMAGE
# ==========================================
docker_build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG

# ==========================================
# 4. CONTAINER IMAGE SCAN (Trivy)
# ==========================================
trivy_image:
  stage: container_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - export TRIVY_USERNAME="$CI_REGISTRY_USER"
    - export TRIVY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - trivy image --severity HIGH,CRITICAL --format json -o trivy-image-report.json $IMAGE_TAG || true
  artifacts:
    when: always
    paths:
      - trivy-image-report.json
  allow_failure: true

# ==========================================
# 5. DAST (OWASP ZAP)
# ==========================================
zap_dast:
  stage: dast
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker pull $IMAGE_TAG
    # Start the vulnerable application in the background
    - docker run -d --name target-app -p 5000:5000 $IMAGE_TAG
    - sleep 10 # Wait for Flask to boot up
    # Run ZAP scan against the local container
    - docker run --rm --network="host" -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable zap-baseline.py -t http://docker:5000 -J zap-report.json -r zap-report.html || true
  artifacts:
    when: always
    paths:
      - zap-report.json
      - zap-report.html
  allow_failure: true
