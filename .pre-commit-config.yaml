# Development level (shift-left): these checks run on every `git commit`, before code reaches GitHub.
# Setup once: pip install pre-commit && pre-commit install
# Full local scan with all tools (Docker only): .\scripts\local-scan.ps1
#
# Python hooks are started with `python -m` instead of their generated .exe launchers:
# Windows Smart App Control blocks those unsigned launchers, but trusts the signed python.exe.
repos:
  - repo: local
    hooks:
      # Standard format checkers
      - id: check-yaml
        name: check yaml
        entry: python -m pre_commit_hooks.check_yaml
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [yaml]
      - id: end-of-file-fixer
        name: fix end of files
        entry: python -m pre_commit_hooks.end_of_file_fixer
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
        language: python
        additional_dependencies: ["pre-commit-hooks==6.0.0"]
        types: [text]

      # SAST: same rules and exemptions as the pipeline (bandit.yaml), MEDIUM and above
      - id: bandit
        name: bandit (SAST)
        entry: python -m bandit -ll -c bandit.yaml
        language: python
        additional_dependencies: ["bandit==1.9.4"]
        files: ^app/.*\.py$

      # IaC: Dockerfile and GitHub Actions workflows, same image and config as the pipeline
      - id: checkov
        name: checkov (IaC)
        entry: bridgecrew/checkov:latest --config-file .checkov.yaml
        language: docker_image
        pass_filenames: false
        always_run: true

  # Secrets: blocks a commit that contains a key, token or password
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
